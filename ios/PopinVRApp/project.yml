name: PopinVR
options:
  bundleIdPrefix: jp.popinvr
  deploymentTarget:
    iOS: "17.0"
packages:
  PopinVRCore:
    path: ../PopinVRCore
targets:
  PopinVR:
    type: application
    platform: iOS
    sources:
      - path: Sources/PopinVRApp
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.popinvr.app
        PRODUCT_NAME: PopinVR
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PopinVR
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: PopinVRCore
        product: PopinVRCore
